<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bewerbung Autofill — Profil</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 520px; margin: 32px auto; padding: 0 16px; color: #1c1f24; }
  h1 { font-size: 20px; } p.sub { color: #6b7280; font-size: 13px; }
  .field { margin-bottom: 12px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 13px; }
  input { width: 100%; padding: 9px; border: 1px solid #d7dbe0; border-radius: 7px; font-size: 14px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
  #saved { color: #15803d; margin-left: 10px; }
</style>
</head>
<body>
  <h1>Profil für Autofill</h1>
  <p class="sub">Wird nur lokal in diesem Browser gespeichert (chrome.storage). Keine Daten verlassen dein Gerät.</p>
  <form id="form"></form>
  <button id="save">Speichern</button><span id="saved"></span>
  <script src="profile.js"></script>
  <script src="options.js"></script>
</body>
</html>
