<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 14px; color: #1c1f24; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.sub { color: #6b7280; margin: 0 0 12px; font-size: 12px; }
  button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; font-size: 14px; }
  button:hover { background: #1d4ed8; }
  #status { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .ok { color: #15803d; } .warn { color: #b45309; } .err { color: #b91c1c; }
  a { color: #2563eb; font-size: 12px; display: inline-block; margin-top: 10px; }
</style>
</head>
<body>
  <h1>Bewerbung Autofill</h1>
  <p class="sub">Füllt die Felder dieser Seite aus deinem Profil. Sendet nichts ab.</p>
  <button id="fill">Diese Seite ausfüllen</button>
  <div id="status" role="status" aria-live="polite"></div>
  <a href="#" id="opts">Profil bearbeiten →</a>
  <script src="popup.js"></script>
</body>
</html>
