<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Dashboard{% endblock %}</title>
  <style>
    /* Design system: Dark Mode (OLED). Tokeni semantici, temă dark. */
    :root {
      --bg:#0f172a; --surface:#1e293b; --surface-2:#272f42;
      --fg:#f8fafc; --muted:#94a3b8; --border:#334155; --border-strong:#475569;
      --accent:#22c55e; --accent-fg:#052e16;
      --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
      --radius:10px; --dur:180ms;
    }
    * { box-sizing:border-box; }
    html { color-scheme:dark; }
    body {
      margin:0; background:var(--bg); color:var(--fg);
      font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .wrap { max-width:1080px; margin:0 auto; padding:40px 20px 64px; }
    h1 { font-size:22px; font-weight:700; margin:0 0 4px; letter-spacing:-.01em; }
    h3 { font-size:14px; font-weight:600; color:var(--muted); text-transform:uppercase;
         letter-spacing:.06em; margin:28px 0 10px; }
    .sub { color:var(--muted); margin:0 0 26px; font-size:14px; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .mono { font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; }
    .num { font-variant-numeric:tabular-nums; }

    /* Formular de adăugare */
    form.add { margin:0 0 28px; }
    form.add label { display:block; font-size:13px; color:var(--muted); margin-bottom:7px; }
    .add-row { display:flex; gap:10px; }
    input[type=url] {
      flex:1; padding:12px 14px; background:var(--surface); color:var(--fg);
      border:1px solid var(--border-strong); border-radius:var(--radius); font-size:15px;
      transition:border-color var(--dur) ease, box-shadow var(--dur) ease;
    }
    input[type=url]::placeholder { color:#64748b; }
    input[type=url]:focus {
      outline:none; border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(34,197,94,.25);
    }
    button { font:inherit; cursor:pointer; border:0; border-radius:var(--radius);
             transition:background var(--dur) ease, opacity var(--dur) ease, color var(--dur) ease; }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .btn-primary { padding:12px 20px; background:var(--accent); color:var(--accent-fg); font-weight:600; }
    .btn-primary:hover { opacity:.9; }
    .icon-btn {
      display:inline-flex; align-items:center; justify-content:center;
      width:34px; height:34px; background:transparent; color:var(--muted);
      border:1px solid var(--border);
    }
    .icon-btn:hover { color:var(--err); border-color:var(--err); }
    .icon-btn svg { width:16px; height:16px; }

    /* Tabel (scroll orizontal pe ecrane mici) */
    .table-scroll { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); }
    table { width:100%; border-collapse:collapse; background:var(--surface); min-width:720px; }
    th, td { text-align:left; padding:12px 14px; border-bottom:1px solid var(--border); font-size:14px; }
    th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
    tbody tr:last-child td { border-bottom:0; }
    tbody tr { transition:background var(--dur) ease; }
    tbody tr:hover { background:var(--surface-2); }
    td.dim { color:var(--muted); }

    /* Pastile de status (culoare + text, nu doar culoare) */
    .pill { display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;
            text-transform:uppercase; letter-spacing:.03em; }
    .pill.ok      { background:rgba(34,197,94,.15);  color:var(--ok); }
    .pill.partial { background:rgba(245,158,11,.15); color:var(--warn); }
    .pill.error   { background:rgba(239,68,68,.15);  color:var(--err); }

    /* Mesaje (Django) */
    .msgs { list-style:none; padding:0; margin:0 0 20px; }
    .msgs li { padding:11px 15px; border-radius:var(--radius); margin-bottom:8px; font-size:14px;
               border:1px solid transparent; }
    .msgs .success { background:rgba(34,197,94,.1);  color:var(--ok);  border-color:rgba(34,197,94,.3); }
    .msgs .warning { background:rgba(245,158,11,.1); color:var(--warn);border-color:rgba(245,158,11,.3); }
    .msgs .error   { background:rgba(239,68,68,.1);  color:var(--err); border-color:rgba(239,68,68,.3); }
    .msgs .info    { background:rgba(148,163,184,.12);color:var(--fg); border-color:var(--border-strong); }

    .empty { color:var(--muted); text-align:center; padding:48px 20px; border:1px dashed var(--border-strong);
             border-radius:var(--radius); }

    /* Detaliu */
    .meta { display:flex; flex-wrap:wrap; gap:8px 18px; color:var(--muted); font-size:14px; margin:0 0 16px; }
    .meta strong { color:var(--fg); font-weight:600; }
    .desc { white-space:pre-wrap; background:var(--surface); border:1px solid var(--border);
            border-radius:var(--radius); padding:16px; line-height:1.6; }
    pre.raw { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
              padding:16px; overflow:auto; font-size:13px; color:var(--muted); }

    /* Formular de editare (detail) */
    .form-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
                 gap:14px; margin:0 0 16px; }
    .form-grid .full { grid-column:1 / -1; }
    .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px;
                   text-transform:uppercase; letter-spacing:.04em; }
    .field input, .field textarea, .field select {
      width:100%; padding:10px 12px; background:var(--surface); color:var(--fg);
      border:1px solid var(--border-strong); border-radius:var(--radius); font:inherit;
      transition:border-color var(--dur) ease, box-shadow var(--dur) ease;
    }
    .field input:focus, .field textarea:focus {
      outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(34,197,94,.25);
    }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin:18px 0 8px; }
    .btn-secondary { padding:11px 16px; background:var(--surface-2); color:var(--fg);
                     border:1px solid var(--border-strong); font-weight:600; }
    .btn-secondary:hover { border-color:var(--accent); }
    .btn-danger { padding:11px 16px; background:var(--err); color:#fff; font-weight:600; }
    /* Badge stare trimitere */
    .pill.draft { background:rgba(148,163,184,.15); color:var(--muted); }
    .pill.senden_pushed { background:rgba(245,158,11,.15); color:var(--warn); }
    .pill.processed { background:rgba(34,197,94,.15); color:var(--ok); }
    /* Banner mod poll */
    .banner { padding:12px 16px; border-radius:var(--radius); margin:0 0 18px; font-size:14px;
              border:1px solid; }
    .banner.live { background:rgba(239,68,68,.1); color:var(--err); border-color:rgba(239,68,68,.35); }
    .banner.dry { background:rgba(245,158,11,.1); color:var(--warn); border-color:rgba(245,158,11,.35); }

    @media (max-width:520px) {
      .add-row { flex-direction:column; }
      .btn-primary { width:100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition:none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    {% if messages %}
      <ul class="msgs" role="status" aria-live="polite">
        {% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
