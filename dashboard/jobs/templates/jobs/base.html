<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Dashboard{% endblock %}</title>
  <style>
    /* Design system: Dark Mode (OLED). Tokeni semantici, temă dark. */
    :root {
      --bg:#0f172a; --surface:#1e293b; --surface-2:#272f42;
      --fg:#f8fafc; --muted:#94a3b8; --border:#334155; --border-strong:#475569;
      --accent:#22c55e; --accent-fg:#052e16;
      --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
      --radius:10px; --dur:180ms;
    }
    * { box-sizing:border-box; }
    html { color-scheme:dark; }
    body {
      margin:0; background:var(--bg); color:var(--fg);
      font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    /* Layout cu meniu lateral */
    .layout { display:flex; min-height:100dvh; }
    .side { width:200px; flex-shrink:0; background:var(--surface);
            border-right:1px solid var(--border); padding:24px 14px; }
    .brand { font-weight:700; font-size:15px; margin-bottom:22px; padding:0 12px; }
    .nav-link { display:block; padding:11px 12px; border-radius:8px; color:var(--muted);
                margin-bottom:4px; font-weight:500;
                transition:background var(--dur) ease, color var(--dur) ease; }
    .nav-link:hover { color:var(--fg); text-decoration:none; }
    .nav-link.active { background:var(--surface-2); color:var(--fg); }
    .nav-link:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .wrap { flex:1; max-width:1080px; margin:0 auto; padding:40px 20px 64px; min-width:0; }
    h1 { font-size:22px; font-weight:700; margin:0 0 4px; letter-spacing:-.01em; }
    h3 { font-size:14px; font-weight:600; color:var(--muted); text-transform:uppercase;
         letter-spacing:.06em; margin:28px 0 10px; }
    .sub { color:var(--muted); margin:0 0 26px; font-size:14px; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .mono { font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; }
    .num { font-variant-numeric:tabular-nums; }

    /* Formular de adăugare */
    form.add { margin:0 0 28px; }
    form.add label { display:block; font-size:13px; color:var(--muted); margin-bottom:7px; }
    .add-row { display:flex; gap:10px; }
    input[type=url] {
      flex:1; padding:12px 14px; background:var(--surface); color:var(--fg);
      border:1px solid var(--border-strong); border-radius:var(--radius); font-size:15px;
      transition:border-color var(--dur) ease, box-shadow var(--dur) ease;
    }
    input[type=url]::placeholder { color:#64748b; }
    input[type=url]:focus {
      outline:none; border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(34,197,94,.25);
    }
    button { font:inherit; cursor:pointer; border:0; border-radius:var(--radius);
             transition:background var(--dur) ease, opacity var(--dur) ease, color var(--dur) ease; }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .btn-primary { padding:12px 20px; background:var(--accent); color:var(--accent-fg); font-weight:600; }
    .btn-primary:hover { opacity:.9; }
    .icon-btn {
      display:inline-flex; align-items:center; justify-content:center;
      width:34px; height:34px; background:transparent; color:var(--muted);
      border:1px solid var(--border);
    }
    .icon-btn:hover { color:var(--err); border-color:var(--err); }
    .icon-btn svg { width:16px; height:16px; }

    /* Tabel (scroll orizontal pe ecrane mici) */
    .table-scroll { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); }
    table { width:100%; border-collapse:collapse; background:var(--surface); min-width:720px; }
    th, td { text-align:left; padding:12px 14px; border-bottom:1px solid var(--border); font-size:14px; }
    th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
    tbody tr:last-child td { border-bottom:0; }
    tbody tr { transition:background var(--dur) ease; }
    tbody tr:hover { background:var(--surface-2); }
    td.dim { color:var(--muted); }

    /* Pastile de status (culoare + text, nu doar culoare) */
    .pill { display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;
            text-transform:uppercase; letter-spacing:.03em; }
    .pill.ok      { background:rgba(34,197,94,.15);  color:var(--ok); }
    .pill.partial { background:rgba(245,158,11,.15); color:var(--warn); }
    .pill.error   { background:rgba(239,68,68,.15);  color:#f87171; } /* contrast ≥4.5:1 */

    /* Mesaje (Django) */
    .msgs { list-style:none; padding:0; margin:0 0 20px; }
    .msgs li { padding:11px 15px; border-radius:var(--radius); margin-bottom:8px; font-size:14px;
               border:1px solid transparent; }
    .msgs .success { background:rgba(34,197,94,.1);  color:var(--ok);  border-color:rgba(34,197,94,.3); }
    .msgs .warning { background:rgba(245,158,11,.1); color:var(--warn);border-color:rgba(245,158,11,.3); }
    .msgs .error   { background:rgba(239,68,68,.1);  color:var(--err); border-color:rgba(239,68,68,.3); }
    .msgs .info    { background:rgba(148,163,184,.12);color:var(--fg); border-color:var(--border-strong); }

    .empty { color:var(--muted); text-align:center; padding:48px 20px; border:1px dashed var(--border-strong);
             border-radius:var(--radius); }

    /* Detaliu */
    .meta { display:flex; flex-wrap:wrap; gap:8px 18px; color:var(--muted); font-size:14px; margin:0 0 16px; }
    .meta strong { color:var(--fg); font-weight:600; }
    .desc { white-space:pre-wrap; background:var(--surface); border:1px solid var(--border);
            border-radius:var(--radius); padding:16px; line-height:1.6; }
    pre.raw { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
              padding:16px; overflow:auto; font-size:13px; color:var(--muted); }

    /* Formular de editare (detail) */
    .form-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
                 gap:14px; margin:0 0 16px; }
    .form-grid .full { grid-column:1 / -1; }
    .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px;
                   text-transform:uppercase; letter-spacing:.04em; }
    .field input, .field textarea, .field select {
      width:100%; padding:10px 12px; background:var(--surface); color:var(--fg);
      border:1px solid var(--border-strong); border-radius:var(--radius); font:inherit;
      transition:border-color var(--dur) ease, box-shadow var(--dur) ease;
    }
    .field input:focus, .field textarea:focus {
      outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(34,197,94,.25);
    }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin:18px 0 8px; }
    .btn-secondary { padding:11px 16px; background:var(--surface-2); color:var(--fg);
                     border:1px solid var(--border-strong); font-weight:600; }
    .btn-secondary:hover { border-color:var(--accent); }
    .btn-danger { padding:11px 16px; background:var(--err); color:#fff; font-weight:600; }
    /* Badge stare trimitere: draft → generated → sent (+ error). Aceleași
       culori se refolosesc pentru stările de căutare (vazut/nou/done/running)
       — liste de selectori, nu declarații duplicate. */
    .pill.draft, .pill.vazut { background:rgba(148,163,184,.15); color:var(--muted); }
    .pill.generated, .pill.nou { background:rgba(76,139,245,.18); color:#7ea6f7; }
    .pill.sent, .pill.done { background:rgba(34,197,94,.15); color:var(--ok); }
    .pill.sending, .pill.running { background:rgba(245,158,11,.15); color:var(--warn); }
    /* Bannere de avertizare (confirmare transmitere) */
    .banner { padding:12px 16px; border-radius:var(--radius); margin:0 0 18px; font-size:14px;
              border:1px solid; }
    .banner.live { background:rgba(239,68,68,.1); color:var(--err); border-color:rgba(239,68,68,.35); }
    .banner.dry { background:rgba(245,158,11,.1); color:var(--warn); border-color:rgba(245,158,11,.35); }
    /* Comutatorul LIVE */
    .live-toggle { display:flex; align-items:center; gap:10px; padding:12px 14px; margin:0 0 14px;
                   background:var(--surface); border:1px solid var(--border-strong);
                   border-radius:var(--radius); cursor:pointer; font-size:14px; }
    .live-toggle input { width:18px; height:18px; accent-color:var(--err); cursor:pointer; }
    /* Textarea mari (preview editabil) */
    .field textarea.big { min-height:220px; line-height:1.6; resize:vertical; }
    .row-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .row-actions form { margin:0; }
    .btn-small { padding:7px 12px; font-size:13px; }
    /* Link stilizat ca buton (fără <button> imbricat în <a> — HTML invalid) */
    a.btnlike { display:inline-block; text-align:center; cursor:pointer; }
    a.btnlike:hover { text-decoration:none; opacity:.9; }

    /* ── Secțiunea Căutare (adaosuri, nicio regulă PREEXISTENTĂ schimbată —
       pastilele de mai sus au fost unite ca liste de selectori tocmai ca să
       nu ducă la reguli duplicate) ── */

    /* Erori de câmp — distincte vizual de `.hint` (text de ajutor neutru) */
    .field-error { color:var(--err); font-size:12px; margin:5px 0 0; font-weight:600; }

    /* Filtre avansate — progressive disclosure */
    details.adv { margin:0 0 18px; background:var(--surface);
                  border:1px solid var(--border); border-radius:var(--radius); }
    details.adv > summary { cursor:pointer; padding:12px 16px; font-size:14px;
                            font-weight:600; color:var(--fg); }
    details.adv > summary:focus-visible { outline:2px solid var(--accent);
                                          outline-offset:2px; }
    details.adv .adv-body { padding:4px 16px 16px; }
    details.adv[open] > summary { border-bottom:1px solid var(--border); }
    .hint { color:var(--muted); font-size:12px; margin:5px 0 0; }

    /* Formularul separat (GET) de alegere a presetului */
    .preset-form { margin:0 0 18px; max-width:360px; }

    /* Comutator neutru (opțiuni de căutare) — layout ca `.live-toggle`, dar
       fără semantica de pericol (accent roșu e rezervată comutatorului LIVE
       din transmit_confirm.html, neatins aici). */
    .opt-toggle { display:flex; align-items:center; gap:10px; padding:12px 14px; margin:0 0 14px;
                  background:var(--surface); border:1px solid var(--border-strong);
                  border-radius:var(--radius); cursor:pointer; font-size:14px; }
    .opt-toggle input { width:18px; height:18px; accent-color:var(--accent); cursor:pointer; }
    .opt-toggle .hint { display:block; }

    /* Grup de checkbox-uri (site-uri). `CheckboxSelectMultiple` din Django
       6.0.7 randează `<div id="id_sites"><div><label>…</label></div>…</div>`
       — fără `<ul>`/`<li>` — deci înfășurarea se aplică pe div-ul copil direct
       al fieldset-ului, nu pe un `ul` care nu există niciodată în markup. */
    fieldset.sites { border:1px solid var(--border-strong); border-radius:var(--radius);
                     padding:12px 14px; margin:0 0 14px; }
    fieldset.sites legend { font-size:12px; color:var(--muted);
                            text-transform:uppercase; letter-spacing:.04em;
                            padding:0 6px; }
    fieldset.sites > div { display:flex; flex-wrap:wrap; gap:8px 18px; }
    /* 44px de zonă de atins, nu doar caseta de 18px */
    fieldset.sites label { display:flex; align-items:center; gap:8px;
                           min-height:44px; cursor:pointer; font-size:14px; }
    fieldset.sites input { width:18px; height:18px; accent-color:var(--accent); }

    /* Coloana de selecție din tabelul de rezultate */
    td.checkcol, th.checkcol { width:44px; text-align:center; }
    td.checkcol input, th.checkcol input { width:18px; height:18px;
                                           accent-color:var(--accent);
                                           cursor:pointer; }
    .score { font-weight:700; font-variant-numeric:tabular-nums; }

    /* Bara de acțiune în bloc */
    .bulkbar { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
               margin:14px 0 0; padding:12px 16px; background:var(--surface);
               border:1px solid var(--border-strong); border-radius:var(--radius); }
    .bulkbar .count { color:var(--muted); font-size:14px; }
    .btn-primary:disabled { opacity:.45; cursor:not-allowed; }

    /* Chips cu parametrii rulării */
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; }
    .chips span { font-size:12px; padding:4px 10px; border-radius:20px;
                  background:var(--surface-2); color:var(--muted);
                  border:1px solid var(--border); }

    @media (max-width:720px) {
      .layout { flex-direction:column; }
      .side { width:100%; display:flex; align-items:center; gap:6px;
              border-right:0; border-bottom:1px solid var(--border); padding:12px 16px; }
      .brand { margin:0 10px 0 0; }
      .nav-link { margin:0; }
    }
    @media (max-width:520px) {
      .add-row { flex-direction:column; }
      .btn-primary { width:100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition:none !important; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <nav class="side" aria-label="Meniu principal">
      <div class="brand">Job Dashboard</div>
      <a class="nav-link {% if section == 'jobs' %}active{% endif %}"
         {% if section == 'jobs' %}aria-current="page"{% endif %} href="{% url 'index' %}">Joburi</a>
      <a class="nav-link {% if section == 'search' %}active{% endif %}"
         {% if section == 'search' %}aria-current="page"{% endif %}
         href="{% url 'search_index' %}">Căutare</a>
      <a class="nav-link {% if section == 'sent' %}active{% endif %}"
         {% if section == 'sent' %}aria-current="page"{% endif %} href="{% url 'sent_list' %}">Trimise</a>
    </nav>
    <main class="wrap">
      {% if messages %}
        <ul class="msgs" role="status" aria-live="polite">
          {% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}
        </ul>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
