# ============================================================
# Job_app — Configurare generală
# ============================================================

# ── Profil Aplicant ─────────────────────────────────────────
applicant:
  name: "George Sebastian Cucuiet"
  email: "george.cucuiet@gmx.de"
  phone: "+49 160 415 5546"
  linkedin: "linkedin.com/in/george-sebastian-c-212b7455"
  github: "github.com/Geronimo1975"
  location: "Deutschland"
  languages:
    - "Deutsch (B2-C1)"
    - "Englisch (C1)"
    - "Rumänisch (Muttersprache)"

# ── Skills & Keywords ───────────────────────────────────────
skills:
  primary:
    - "Python"
    - "Django"
    - "AI/ML"
    - "LLM APIs (OpenAI, Claude, Gemini)"
    - "Workflow Automation (n8n, Make.com)"
    - "Data Engineering"
  secondary:
    - "JavaScript"
    - "React"
    - "Docker"
    - "PostgreSQL"
    - "REST APIs"
    - "Git"
  gaming_specific:
    - "Game Design"
    - "Unity"
    - "Unreal Engine"
    - "Technical Artist"
    - "Game Producer"
    - "QA Automation"
    - "LiveOps"
    - "Analytics"

# ── Scraping ────────────────────────────────────────────────
scraping:
  # Intervall între scraping runs (minute)
  interval_minutes: 360
  # Max joburi per apel de scraping
  max_results_per_call: 50
  # Vechimea maximă a anunțului (ore). La interval de 6h, 168h însemna
  # re-descărcarea acelorași joburi de ~28 de ori.
  hours_old: 72

  # ── Piețe ─────────────────────────────────────────────────
  # O piață = țară + limbă + keywords + surse. Codul primește un obiect
  # Market; adăugarea unei țări noi se face aici, fără cod nou.
  markets:
    de:
      country: "GERMANY"          # enum jobspy Country
      language: "de"              # → col „Sprache" → limba Anschreiben
      locations: ["Germany"]      # la nivel de țară, NU pe orașe:
                                  # Indeed întoarce oricum toate orașele
      remote: false
      keyword_groups:
        - ["Python Developer", "Django Developer", "Backend Engineer"]
        - ["AI Engineer", "LLM Engineer", "Machine Learning Engineer"]
        - ["Data Engineer", "Automation Engineer"]
      sources: ["jobspy", "career_pages"]
      best_effort_sources: ["linkedin"]

    ro_remote:
      country: "ROMANIA"
      language: "en"              # scrisoare EN, nu Anschreiben german
      locations: ["Romania"]
      remote: true                # → jobspy is_remote=True
      keyword_groups:
        - ["Python Developer", "Django Developer"]
        - ["AI Engineer", "LLM Engineer"]
      sources: ["jobspy", "remote_boards", "ro_boards"]
      best_effort_sources: ["ro_boards", "linkedin"]

  # Site-uri jobspy folosite per piață
  jobspy_sites: ["indeed", "linkedin"]

  # Filtre — citite de filters/relevance.py
  filters:
    exclude_keywords:
      - "Senior Staff"
      - "Principal"
      - "Director"
      - "VP"
      - "Head of"
    min_salary: 0
    # Sub acest scor local jobul NU ajunge la AI
    min_prescore: 40

# ── AI / LLM ───────────────────────────────────────────────
ai:
  # Provider: "anthropic" sau "openai"
  provider: "anthropic"
  model: "claude-sonnet-4-6"
  # Temperatura pentru generare cover letter
  temperature: 0.7
  # Limba preferată pentru Anschreiben
  default_language: "de"
  # Max tokens per generare
  max_tokens: 2000

# ── Email / SMTP ────────────────────────────────────────────
email:
  # Provider activ: "gmx" sau "brevo"
  active_provider: "gmx"
  providers:
    gmx:
      server: "mail.gmx.net"
      port: 587
      login: "george.cucuiet@gmx.de"
      env_password_key: "GMX_PASSWORD"
    brevo:
      server: "smtp-relay.brevo.com"
      port: 587
      login: "george.cucuiet@gmx.de"
      env_password_key: "BREVO_SMTP_KEY"
  # Rate limiting
  max_emails_per_day: 10
  delay_between_emails_sec: 30
  # Dry run implicit (safety)
  dry_run_default: true

# ── Tracker ─────────────────────────────────────────────────
tracker:
  file: "data/Job_Application_Tracker.xlsx"
  auto_backup: true
  backup_dir: "data/backups"

# ── Documente ───────────────────────────────────────────────
documents:
  cv_file: "documents/cv/Resume George Sebastian Cucuiet.pdf"
  certificates_dir: "documents/certificates"
  references_dir: "documents/references"
  cover_letters_dir: "documents/cover_letters/generated"
  templates_dir: "documents/cover_letters/templates"

# ── Output / Logging ───────────────────────────────────────
output:
  logs_dir: "output/logs"
  reports_dir: "output/reports"
  sent_dir: "output/sent_emails"
  log_level: "INFO"

# ── n8n Integration ─────────────────────────────────────────
n8n:
  enabled: true
  base_url: "https://app.n8n-studio.com"
  paths:
    ingest: "/webhook/jobapp-ingest"
    pending: "/webhook/jobapp-pending"
    upload: "/webhook/jobapp-upload"
    trigger: "/webhook/jobapp-trigger"
  secret_env: "N8N_WEBHOOK_SECRET"
  poll_interval_min: 10
  timeout_sec: 20
