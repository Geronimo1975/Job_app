# ============================================================
# Job_app — Configurare generală
# ============================================================

# ── Profil Aplicant ─────────────────────────────────────────
applicant:
  name: "George Sebastian Cucuiet"
  email: "george.cucuiet@gmx.de"
  phone: "+49 160 415 5546"
  linkedin: "linkedin.com/in/george-sebastian-c-212b7455"
  github: "github.com/Geronimo1975"
  location: "Deutschland"
  languages:
    - "Deutsch (B2-C1)"
    - "Englisch (C1)"
    - "Rumänisch (Muttersprache)"

# ── Skills & Keywords ───────────────────────────────────────
skills:
  primary:
    - "Claude Code"
    - "AI Automation"
    - "n8n"
    - "Workflow Automation (Make.com, Zapier)"
    - "Chatbot"
    - "Conversational AI"
    - "SEO"
    - "LLM APIs (OpenAI, Claude, Gemini)"
  secondary:
    - "Python"
    - "Django"
    - "JavaScript"
    - "Docker"
    - "PostgreSQL"
    - "REST APIs"
    - "Git"
  gaming_specific:
    - "Game Design"
    - "Unity"
    - "Unreal Engine"
    - "Technical Artist"
    - "Game Producer"
    - "QA Automation"
    - "LiveOps"
    - "Analytics"

# ── Scraping ────────────────────────────────────────────────
scraping:
  # Intervall între scraping runs (minute)
  interval_minutes: 360
  # Max joburi per apel de scraping
  max_results_per_call: 50
  # Vechimea maximă a anunțului (ore). A fost 72; urcat la 168 (7 zile) pe
  # 2026-08-23, fiindcă sub `require_email: true` randamentul e ~2% din brut —
  # o fereastră de 3 zile lăsa prea puține anunțuri ca să iasă ceva trimisibil.
  # Re-descărcarea aceluiași job NU e o problemă: `store/seen.py` deduplică
  # între rulări, deci costul e doar de rețea.
  hours_old: 168

  # ── Piețe ─────────────────────────────────────────────────
  # O piață = țară + limbă + keywords + surse. Codul primește un obiect
  # Market; adăugarea unei țări noi se face aici, fără cod nou.
  markets:
    # ── Nucleu: remote oriunde („nomad") ──────────────────────
    # Indeed NU acoperă asta: pe domeniul `www` (`country: worldwide`) întoarce
    # 0 rezultate (măsurat 2026-08-07), de aceea piața e doar LinkedIn — care
    # dă exact profilul căutat („AI Automation Engineer (Make.com / n8n)").
    # ⚠ LinkedIn nu expune NICIODATĂ adrese de email: rândurile de aici intră
    # cu „Bewerbungsart: Portal" și se aplică din „Apply URL".
    # ── remote_global: DEZACTIVATĂ 2026-08-23 ─────────────────
    # Era nucleul „nomad" și dădea exact profilul căutat, dar e o piață DOAR
    # LinkedIn, iar LinkedIn nu expune descrieri (`linkedin_fetch_description:
    # false`) — deci nu poate produce NICIODATĂ o adresă de email: măsurat
    # 2026-08-23, 0 din 1056 de anunțuri. Cu `require_email: true` global
    # (cerință explicită a userului: fără adresă nu se poate trimite), piața
    # contribuia 0 rânduri pentru 77% din efortul de scraping. Indeed nu o
    # poate înlocui: pe `country: worldwide` întoarce 0 rezultate (2026-08-07).
    # Blocul e comentat, nu șters — ca `nl`. Se reactivează dacă se renunță la
    # `require_email` sau dacă apare o sursă remote-global cu descrieri.
    # remote_global:
    #   country: "worldwide"
    #   language: "en"
    #   locations: ["European Union"]
    #   remote: true
    #   jobspy_sites: ["linkedin"]
    #   keyword_groups: *skills_groups
    #   sources: ["jobspy"]
    #   best_effort_sources: ["linkedin"]

    # ── Locații unde e acceptat și modelul HIBRID ─────────────
    # `remote: false` NU înseamnă „doar on-site": înseamnă că nu se aplică
    # filtrul remote, deci vin ȘI anunțurile remote, ȘI cele hibride/on-site.
    # Tot aici se găsesc adresele de email (anunțurile locale scriu
    # „Bewerbung an …"): DE 17%, AT 13%, SE 10%, NL 10% — măsurat 2026-08-07.
    de:
      country: "germany"
      language: "de"                   # piața de acasă → Anschreiben în germană
      locations: ["Germany"]
      remote: false
      # ⚠ Ancora YAML e definită AICI, pe prima piață activă. Stătea pe
      # `remote_global`; la dezactivarea aceleia, comentarea blocului ar fi
      # șters ancora și toate `*skills_groups` de mai jos ar fi crăpat la
      # încărcare. O piață nouă pusă înaintea lui `de` trebuie fie să preia
      # ancora, fie să folosească tot `*skills_groups`.
      keyword_groups: &skills_groups
        - ["Claude Code", "AI Developer", "vibe coding", "AI Automation"]
        - ["n8n", "workflow automation", "Make.com", "Zapier"]
        - ["chatbot developer", "conversational AI", "LLM integration"]
        - ["SEO specialist", "technical SEO", "AI SEO", "GEO optimization"]
        # Python/Django lipseau complet din căutări: erau doar în
        # `skills.secondary`, care influențează SCORUL dar nu se caută
        # niciodată. Userul se pregătește pe Python/Django (2026-08-23).
        - ["Python Developer", "Django", "Backend Developer", "FastAPI"]
      sources: ["jobspy"]
      best_effort_sources: ["linkedin"]

    at:
      country: "austria"
      language: "de"
      locations: ["Austria"]
      remote: false
      keyword_groups: *skills_groups
      sources: ["jobspy"]
      best_effort_sources: ["linkedin"]

    ch:
      country: "switzerland"
      language: "en"                   # scrisori EN pentru CH (decizia userului)
      locations: ["Switzerland"]
      remote: false
      keyword_groups: *skills_groups
      sources: ["jobspy"]
      best_effort_sources: ["linkedin"]

    # ── nl: DEZACTIVATĂ 2026-08-18 ──────────────────────────────
    # Piața dădea a doua cea mai bună rată de email (10%), dar candidaturile
    # erau respinse pentru necunoașterea neerlandezei — anunțurile NL cer
    # limba chiar și când sunt scrise în engleză. Blocul e păstrat comentat,
    # nu șters: dacă se reia, se decomentează ca atare.
    # nl:
    #   country: "netherlands"
    #   language: "en"
    #   locations: ["Netherlands"]
    #   remote: false
    #   keyword_groups: *skills_groups
    #   sources: ["jobspy"]
    #   best_effort_sources: ["linkedin"]

    se:
      country: "sweden"
      language: "en"
      locations: ["Sweden"]
      remote: false
      keyword_groups: *skills_groups
      sources: ["jobspy"]
      best_effort_sources: ["linkedin"]

    # ⚠ Cheia TREBUIE citată: YAML 1.1 citește `no` ca boolean False, iar
    # piața ar ajunge înregistrată sub cheia `False` (afișată ca `0`).
    "no":
      country: "norway"
      language: "en"
      locations: ["Norway"]
      remote: false
      keyword_groups: *skills_groups
      sources: ["jobspy"]
      best_effort_sources: ["linkedin"]

    # ⚠ Piața RO cere ADRESĂ, nu remote (decizia userului, 2026-08-22).
    # Cele două condiții se exclud practic aici: măsurat pe 114 anunțuri,
    # cele 3 remote n-au adresă, iar cele 4 cu adresă sunt hibrid/on-site.
    # Cerându-le pe amândouă, piața dădea 0 rânduri — s-a ales adresa,
    # fiindcă doar ea face rândul trimisibil automat.
    # De aceea `remote: false`: filtrul remote ar tăia exact anunțurile locale
    # care scriu „Trimite CV la …", adică singura sursă de adrese (același
    # raționament ca la piața `de`). `require_remote: false` e explicit, nu
    # implicit, ca să se vadă că a fost o alegere, nu o omisiune.
    # `require_email` nu mai e suprascris aici: din 2026-08-23 e `true` global.
    ro:
      country: "romania"
      language: "en"
      locations: ["Romania"]
      remote: false
      require_remote: false
      keyword_groups: *skills_groups
      # eJobs: singura sursă RO cu descrieri complete; ~106 anunțuri/rulare.
      sources: ["jobspy", "ro_boards"]
      best_effort_sources: ["linkedin", "ro_boards"]

    saudi:
      country: "saudi arabia"
      language: "en"
      locations: ["Saudi Arabia"]
      remote: false
      keyword_groups: *skills_groups
      sources: ["jobspy"]
      best_effort_sources: ["linkedin"]

    uae:
      country: "united arab emirates"
      language: "en"
      locations: ["United Arab Emirates"]
      remote: false
      keyword_groups: *skills_groups
      sources: ["jobspy"]
      best_effort_sources: ["linkedin"]

    # ── Extindere europeană (2026-08-23) ──────────────────────
    # Hub-uri tech unde anunțurile sunt frecvent în engleză. Toate pe același
    # tipar ca piețele existente; poarta de limbă (`allowed_languages`) taie
    # anunțurile în limba locală, pe care candidatul nu le poate citi.
    ie:
      country: "ireland"
      language: "en"
      locations: ["Ireland"]
      remote: false
      keyword_groups: *skills_groups
      sources: ["jobspy"]
      best_effort_sources: ["linkedin"]

    es:
      country: "spain"
      language: "en"
      locations: ["Spain"]
      remote: false
      keyword_groups: *skills_groups
      sources: ["jobspy"]
      best_effort_sources: ["linkedin"]

    pt:
      country: "portugal"
      language: "en"
      locations: ["Portugal"]
      remote: false
      keyword_groups: *skills_groups
      sources: ["jobspy"]
      best_effort_sources: ["linkedin"]

    pl:
      country: "poland"
      language: "en"
      locations: ["Poland"]
      remote: false
      keyword_groups: *skills_groups
      sources: ["jobspy"]
      best_effort_sources: ["linkedin"]

    cz:
      country: "czech republic"
      language: "en"
      locations: ["Czech Republic"]
      remote: false
      keyword_groups: *skills_groups
      sources: ["jobspy"]
      best_effort_sources: ["linkedin"]

    dk:
      country: "denmark"
      language: "en"
      locations: ["Denmark"]
      remote: false
      keyword_groups: *skills_groups
      sources: ["jobspy"]
      best_effort_sources: ["linkedin"]

    fi:
      country: "finland"
      language: "en"
      locations: ["Finland"]
      remote: false
      keyword_groups: *skills_groups
      sources: ["jobspy"]
      best_effort_sources: ["linkedin"]

  # Site-uri jobspy folosite per piață. Suportate upstream:
  # indeed, linkedin, glassdoor, google, zip_recruiter, bayt, naukri, bdjobs
  # (zip_recruiter e doar US/CA; bayt/naukri/bdjobs sunt alte regiuni).
  # LinkedIn SCOS 2026-08-23. Emailul se extrage exclusiv din descriere, iar
  # LinkedIn nu livrează descrieri fără `linkedin_fetch_description: true` (un
  # request per job). Măsurat: 0 adrese din 1056 de anunțuri LinkedIn, față de
  # 27 din 213 pe Indeed (12,7%). Cu `require_email: true` global, LinkedIn era
  # 77% din efortul de scraping pentru 0 rânduri utilizabile. Pornirea
  # `linkedin_fetch_description` nu repară: CLAUDE.md a măsurat ~3% adrese, și
  # alea artefacte de parsare (`_mb@oracle.com`).
  jobspy_sites: ["indeed"]

  # Google Jobs cere o sintaxă proprie, identică cu ce ai tasta în browser
  # (ex. „Python Developer jobs near Berlin since yesterday"). Gol = Google
  # nu primește termen special, deci dă rezultate slabe — completează-l dacă
  # adaugi „google" în jobspy_sites.
  google_search_term: ""

  # Descrierile LinkedIn cer un request per job: lent, dar altfel joburile
  # LinkedIn ajung la AI fără descriere, deci fără material pentru Anschreiben.
  linkedin_fetch_description: false

  # Filtre — citite de filters/relevance.py
  filters:
    exclude_keywords:
      - "Senior Staff"
      - "Principal"
      - "Director"
      - "VP"
      - "Head of"
    # Roluri greșite: penalizare mare în prescore (nu hard-reject)
    negative_keywords:
      - "sales"
      - "account manager"
      - "SAP consultant"
      - "support agent"
      - "customer support"
      - "recruiter"
      - "warehouse"
      - "nurse"
      - "accountant"
    # Semnale part-time/flexibil: bonus în prescore
    # "contract" și "remote" au fost eliminate: cvasi-omniprezente în
    # descrierile de anunțuri remote (toate piețele au remote: true),
    # bonusul +20 devenea ofset constant și cobora pragul efectiv (JOB-47)
    flex_signals:
      - "part-time"
      - "parttime"
      - "part time"
      - "freelance"
      - "flexible hours"
    min_salary: 0
    # Sub acest scor local jobul NU ajunge nici în Sheet, nici la AI.
    # Era 30 („titlu perfect + bonus keyword = ~35", JOB-47). Cu emailul scos
    # din rolul de filtru, ăsta a rămas SINGURUL prag, deci trebuie să fie și
    # singurul care decide relevanța.
    # 10 → 8 (2026-08-22): pragul, nu emailul, era ce bloca piața RO. Anunțul
    # FRESCOVERDE („asistenți AI personalizați, chatboți, fluxuri automate,
    # Claude") are adresă de candidatură și e fix profilul căutat, dar scorează
    # 8 — titlul „SPECIALIST AI MARKETING & DIGITAL" nu conține niciun skill la
    # literă, iar potrivirea din descriere valorează 8, nu 20. Reparația de
    # fond ar fi rebalansarea titlu/descriere din `prescore()`; ăsta e pragul
    # coborât până atunci. ⚠ E parametru GLOBAL: atinge toate cele 9 piețe.
    min_prescore: 8
    # ⚠ TRUE GLOBAL din 2026-08-23 — cerință explicită a userului: „fără e-mail
    # nu le pot trimite; dacă în scraping nu există e-mail, nu introduci în
    # tabel". Deci Sheet-ul devine listă strict trimisibilă, nu listă de
    # aplicare manuală: col AA „Bewerbungsart" va fi practic mereu `Email`.
    # Costul e mare și măsurat: doar ~2% din anunțurile brute au adresă (29 din
    # 1373), iar `privacy@`/`reasonable.accommodations@` nu contează ca adresă
    # (vezi `_email_rank`) — deci randamentul real e și mai mic. Din același
    # motiv s-a scos LinkedIn din `jobspy_sites` și s-a dezactivat
    # `remote_global`: fără descriere nu există adresă, deci 0 rânduri.
    # Se poate scuti o piață cu `scraping.markets.<piață>.require_email: false`.
    require_email: true
    # ── Limba anunțului ───────────────────────────────────────
    # Userul citește engleză (C1), germană (B2-C1) și română (nativ). Un anunț
    # suedez sau polonez e inutilizabil oricât ar scora — iar lecția `nl`
    # (JOB-54) e că limba anunțului contează chiar când e scris în engleză.
    # Poarta respinge DOAR pe dovadă pozitivă că e altă limbă; „nu se poate
    # detecta" (descriere lipsă sau listă de keyword-uri) trece mai departe.
    # Listă goală sau absentă = fără regulă. Per piață:
    # `scraping.markets.<piață>.allowed_languages`.
    allowed_languages: ["en", "de", "ro"]
    # „Doar remote" ca POARTĂ (ce păstrăm), distinct de `markets.<piață>.remote`
    # (ce cerem sursei). Rămâne `false` global și se activează per piață: pus
    # aici pe `true` ar goli `remote_global`, unde LinkedIn filtrează deja
    # upstream și nu completează câmpul, deci a doua filtrare taie tot (JOB-48).
    require_remote: false

# ── AI / LLM ───────────────────────────────────────────────
ai:
  # Provider: "anthropic" sau "openai"
  provider: "anthropic"
  model: "claude-opus-4-8"
  # Temperatura pentru generare cover letter
  temperature: 0.7
  # Limba preferată pentru Anschreiben
  default_language: "de"
  # Max tokens per generare
  max_tokens: 2000

# ── Email / SMTP ────────────────────────────────────────────
email:
  # Provider activ: "gmx" sau "brevo"
  active_provider: "gmx"
  providers:
    gmx:
      server: "mail.gmx.net"
      port: 587
      login: "george.cucuiet@gmx.de"
      env_password_key: "GMX_PASSWORD"
    brevo:
      server: "smtp-relay.brevo.com"
      port: 587
      login: "george.cucuiet@gmx.de"
      env_password_key: "BREVO_SMTP_KEY"
  # Rate limiting
  max_emails_per_day: 10
  delay_between_emails_sec: 30
  # Dry run implicit (safety)
  dry_run_default: true

# ── Tracker ─────────────────────────────────────────────────
tracker:
  file: "data/Job_Application_Tracker.xlsx"
  auto_backup: true
  backup_dir: "data/backups"

# ── Documente ───────────────────────────────────────────────
documents:
  # CV per limbă. Limba jobului (`market.language` → col „Sprache") alege
  # varianta, ca Anschreiben-ul și CV-ul să fie în aceeași limbă: `de`/`at`
  # primesc Lebenslauf, restul piețelor Resume.
  # Ambele au STRAT DE TEXT real (generate din sursele HTML din bundle-ul de
  # design) — varianta exportată ca imagine nu putea fi citită de niciun ATS,
  # iar 104 din 143 de rânduri din Sheet se aplică prin portal.
  cv_files:
    de: "documents/cv/Lebenslauf_George_Sebastian_Cucuiet.pdf"
    en: "documents/cv/Resume_George_Sebastian_Cucuiet.pdf"
  # Rezervă pentru limbile fără intrare în `cv_files`.
  cv_file: "documents/cv/Resume_George_Sebastian_Cucuiet.pdf"
  certificates_dir: "documents/certificates"
  references_dir: "documents/references"
  cover_letters_dir: "documents/cover_letters/generated"
  templates_dir: "documents/cover_letters/templates"

# ── Output / Logging ───────────────────────────────────────
output:
  logs_dir: "output/logs"
  reports_dir: "output/reports"
  sent_dir: "output/sent_emails"
  log_level: "INFO"

# ── n8n Integration ─────────────────────────────────────────
n8n:
  enabled: true
  base_url: "https://app.n8n-studio.com"
  paths:
    ingest: "/webhook/jobapp-ingest"
    pending: "/webhook/jobapp-pending"
    upload: "/webhook/jobapp-upload"
    trigger: "/webhook/jobapp-trigger"
    urls: "/webhook/jobapp-urls"
  secret_env: "N8N_WEBHOOK_SECRET"
  poll_interval_min: 10
  timeout_sec: 20
